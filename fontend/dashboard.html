<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberQuest - Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>CyberQuest</h1>

        <h2>Welcome!</h2>

        <p>Choose a training category to begin.</p>

        <section>

            <button onclick="window.location.href='scenarios/phishing.html'">
                Phishing
            </button>

            <button onclick="window.location.href='scenarios/links/links.html'">
                Suspicious Links
            </button>

            <button onclick="window.location.href='scenarios/password/password.html'">
                Password Security
            </button>

            <button onclick="window.location.href='scenarios/physical/physical.html'">
                Physical Security
            </button>

        </section>

        <section>

            <h2>Your Progress</h2>

            <p id="completedCount">Scenarios Completed: 0 / 8</p>

            <p id="safetyScore">Current Safety Score: 0%</p>

            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>

        </section>

    </main>


<script>
    const allScenarios = [
        "1",
        "2",
        "badlink1",
        "badlink2",
        "password1",
        "password2",
        "physical1",
        "physical2"
    ];

    const completed = JSON.parse(
        localStorage.getItem("completedScenarios") || "[]"
    );

    // Count completed scenarios that belong to this project.
    const validCompleted = allScenarios.filter(
        scenario => completed.includes(scenario)
    );

    document.getElementById("completedCount").textContent =
        "Scenarios Completed: " +
        validCompleted.length + " / " + allScenarios.length;

    // Average the latest score from each completed scenario.
    let totalScore = 0;

    validCompleted.forEach(function(scenario) {
        totalScore += Number(
            localStorage.getItem(scenario + "Percent") || 0
        );
    });

    const safetyScore = validCompleted.length > 0
        ? Math.round(totalScore / validCompleted.length)
        : 0;

    document.getElementById("safetyScore").textContent =
        "Current Safety Score: " + safetyScore + "%";

    // Update the visual progress bar.
    const progress = (
        validCompleted.length / allScenarios.length
    ) * 100;

    document.getElementById("progressBar").style.width =
        progress + "%";
</script>

</body>

</html>
